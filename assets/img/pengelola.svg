<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052A40"/>
      <stop offset="50%" stop-color="#073650"/>
      <stop offset="100%" stop-color="#021B2B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#2BA9D1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid & Glow -->
  <circle cx="200" cy="180" r="140" fill="#4CC9F0" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="190" r="95" fill="none" stroke="#4CC9F0" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="180" r="55" fill="url(#accentGrad)"/>
  
  <!-- Smiling Face Minimal Elements -->
  <circle cx="180" cy="175" r="5" fill="#021B2B"/>
  <circle cx="220" cy="175" r="5" fill="#021B2B"/>
  <path d="M 185 198 Q 200 215 215 198" fill="none" stroke="#021B2B" stroke-width="4" stroke-linecap="round"/>

  <!-- Body / Shoulders -->
  <path d="M 105 380 C 105 280, 295 280, 295 380 Z" fill="url(#accentGrad)"/>
  <path d="M 140 380 C 140 310, 260 310, 260 380 Z" fill="#EAF6FB" opacity="0.9"/>
  
  <!-- Badge Icon: Verified Admin / Pengelola -->
  <g transform="translate(255, 230)">
    <circle cx="20" cy="20" r="22" fill="#021B2B" stroke="#4CC9F0" stroke-width="2.5"/>
    <path d="M 13 20 L 18 25 L 28 14" fill="none" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtitle Tag -->
  <rect x="110" y="420" width="180" height="34" rx="17" fill="#021B2B" stroke="#14506E" stroke-width="1.5"/>
  <text x="200" y="442" fill="#4CC9F0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">PENGELOLA UMKM</text>
</svg>
